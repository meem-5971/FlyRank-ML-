<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capstone Research Paper — FlyRank ML</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { box-sizing: border-box; min-width: 200px; max-width: 980px; margin: 0 auto; padding: 45px; }
    @media (max-width: 767px) { body { padding: 15px; } }
  </style>
</head>
<body class="markdown-body">
  <div id="content">Loading report...</div>
  <script>
    fetch('work/capstone_report_template.md')
      .then(response => {
        if (!response.ok) throw new Error('Could not find work/capstone_report.md');
        return response.text();
      })
      .then(text => { document.getElementById('content').innerHTML = marked.parse(text); })
      .catch(err => { document.getElementById('content').innerHTML = '<p style="color:red;">Error loading report: ' + err.message + '</p>'; });
  </script>
</body>
</html>
